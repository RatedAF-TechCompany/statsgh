name: Newsroom Scheduled Scan

on:
  schedule:
    # Budget-optimized: 4 runs/day (00:00, 06:00, 12:00, 18:00 UTC).
    # Each run sweeps ~6h of news. ~£25/month cap.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Newsroom Scan
        run: |
          curl -X POST \
            "https://ofhejtwaigiqyejbvncz.supabase.co/functions/v1/newsroom-scheduled?token=statsgh-newsroom-2026" \
            -H "Content-Type: application/json" \
            -d '{"triggerType": "scheduled"}' \
            --fail-with-body \
            --max-time 300
