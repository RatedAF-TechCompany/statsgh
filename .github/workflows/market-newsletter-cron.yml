name: Market Data & Newsletter Cron
on:
  schedule:
    - cron: '0 */6 * * *'   # Market data every 6 hours
  workflow_dispatch:

jobs:
  market-data:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh market data
        run: |
          curl -s -X POST \
            "https://ofhejtwaigiqyejbvncz.supabase.co/functions/v1/market-data-refresh" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
  # Daily newsletter job removed: email sending is disabled until an email provider is connected.
